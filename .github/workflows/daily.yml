name: Ежедневный сбор крыши

on:
  schedule:
    - cron: '17 0 * * *'  # 05:17 по Актау (UTC+5). GitHub часто опаздывает на 1–5 часов, поэтому с запасом до утра
  workflow_dispatch: {}    # кнопка «Run workflow» для ручного запуска

permissions:
  contents: write

concurrency:
  group: krysha-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - name: Зависимости
        run: pip install -r scraper/requirements.txt

      - name: Проверка разбора (тесты)
        run: python scraper/test_parse.py

      - name: Сбор объявлений
        run: python scraper/krysha_scraper.py

      - name: Образцы HTML для отладки
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-html
          path: debug/
          if-no-files-found: ignore
          retention-days: 7

      - name: Сохранить data.json / status.json
        if: always()
        run: |
          git config user.name "krysha-bot"
          git config user.email "krysha-bot@users.noreply.github.com"
          git add data.json status.json
          git add -f debug || true
          if git diff --cached --quiet; then
            echo "изменений нет"
          else
            git commit -m "data: $(date -u +%F)"
            git pull --rebase
            git push
          fi
